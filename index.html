<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>البروشور التفاعلي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            position: fixed;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
            background-color: #000000;
            overflow: hidden;
        }

        #touch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            touch-action: none;
        }

        #flipbook {
            width: 100%;
            height: 100%;
        }

        #flipbook .page {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
        }

        #flipbook .page img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            pointer-events: none;
            -webkit-user-drag: none;
        }

        /* شريط تحكم علوي صغير وشبه شفاف لكشف أسفل الصفحة بالكامل */
        .ui-controls {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 1000;
        }

        .ui-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .ui-btn:active {
            background: rgba(255, 255, 255, 0.4);
        }

        .page-num {
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            direction: ltr;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شريط تحكم علوي يترك كافة نصوص الصفحة ساطعة ومقروءة -->
        <div class="ui-controls">
            <button class="ui-btn" id="btnNext">التالي ⬅</button>
            <span class="page-num" id="pageIndicator">1 / 6</span>
            <button class="ui-btn" id="btnPrev">➡ السابق</button>
        </div>

        <div id="touch-overlay"></div>

        <div id="flipbook">
            <div class="page"><img src="1.jpg" alt="1"></div>
            <div class="page"><img src="2.jpg" alt="2"></div>
            <div class="page"><img src="3.jpg" alt="3"></div>
            <div class="page"><img src="4.jpg" alt="4"></div>
            <div class="page"><img src="5.jpg" alt="5"></div>
            <div class="page"><img src="6.jpg" alt="6"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
    <script>
        $(document).ready(function() {
            const $book = $('#flipbook');
            const totalPages = 6;

            $book.turn({
                width: $(window).width(),
                height: $(window).height(),
                autoCenter: true,
                display: 'single',
                elevation: 50,
                gradients: true,
                acceleration: true,
                duration: 600
            });

            $book.bind('turned', function(event, page) {
                $('#pageIndicator').text(page + ' / ' + totalPages);
            });

            let touchStartX = 0;
            let touchStartY = 0;
            let touchStartTime = 0;

            const overlay = document.getElementById('touch-overlay');

            overlay.addEventListener('touchstart', function(e) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                touchStartTime = Date.now();
            }, { passive: true });

            overlay.addEventListener('touchend', function(e) {
                if ($book.turn('animating')) return;

                let touchEndX = e.changedTouches[0].clientX;
                let touchEndY = e.changedTouches[0].clientY;
                let diffX = touchEndX - touchStartX;
                let diffY = touchEndY - touchStartY;
                let elapsedTime = Date.now() - touchStartTime;

                if (Math.abs(diffX) > 35 && Math.abs(diffX) > Math.abs(diffY) && elapsedTime < 700) {
                    if (diffX < 0) {
                        // سحب من اليمين نحو اليسار -> الانتقال للصفحة التالية
                        $book.turn('next');
                    } else {
                        // سحب من اليسار نحو اليمين -> الرجوع للصفحة السابقة
                        $book.turn('previous');
                    }
                }
            }, { passive: true });

            $('#btnNext').on('click', function(e) {
                e.stopPropagation();
                $book.turn('next');
            });

            $('#btnPrev').on('click', function(e) {
                e.stopPropagation();
                $book.turn('previous');
            });

            $(window).on('resize orientationchange', function() {
                setTimeout(function() {
                    $book.turn('size', $(window).width(), $(window).height());
                }, 150);
            });
        });
    </script>
</body>
</html>
