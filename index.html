<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>البروشور التفاعلي العربي - تقليب احترافي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
            top: 0;
            left: 0;
            background: #0a0a0a;
        }

        /* إضافة تأثير إضاءة خلفي */
        .container::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            background: radial-gradient(ellipse at center, #2a2a2a 0%, #0a0a0a 70%);
            pointer-events: none;
            z-index: 0;
        }

        #book {
            width: 100% !important;
            height: 100% !important;
            transform: scaleX(-1);
            position: relative;
            z-index: 1;
        }

        .page {
            width: 100% !important;
            height: 100% !important;
            background-color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* إضافة ظل داخلي للصفحات */
        .page::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0.05), transparent 20%, transparent 80%, rgba(0,0,0,0.05));
            pointer-events: none;
            z-index: 2;
        }

        .page img {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            display: block;
            pointer-events: none;
            transform: scaleX(-1);
        }

        /* أزرار تحكم جانبية - أنيقة وشفافة */
        .nav-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.7);
            width: 55px;
            height: 55px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            touch-action: none;
            user-select: none;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-50%) scale(1.05);
            color: #fff;
        }

        .nav-btn:active {
            transform: translateY(-50%) scale(0.92);
        }

        .nav-btn.prev {
            right: 20px;
        }

        .nav-btn.next {
            left: 20px;
        }

        .nav-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* مؤشر الصفحات */
        .page-indicator {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 24px;
            border-radius: 50px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        /* إخفاء الأزرار في حالة عدم وجود تفاعل */
        @media (max-width: 768px) {
            .nav-btn {
                width: 44px;
                height: 44px;
                font-size: 18px;
            }
            .nav-btn.prev {
                right: 10px;
            }
            .nav-btn.next {
                left: 10px;
            }
            .page-indicator {
                bottom: 20px;
                padding: 6px 18px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .nav-btn {
                width: 38px;
                height: 38px;
                font-size: 14px;
                opacity: 0.7;
            }
            .nav-btn.prev {
                right: 5px;
            }
            .nav-btn.next {
                left: 5px;
            }
        }

        /* تحميل سريع */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            z-index: 999;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            transition: opacity 0.6s ease;
        }
        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid rgba(255,255,255,0.4);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- شاشة تحميل -->
    <div class="loading" id="loading">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <span>جاري تحميل البروشور...</span>
        </div>
    </div>

    <div class="container">
        <div id="book">
            <div class="page"><img src="1.jpg" alt="الصفحة 1" loading="eager"></div>
            <div class="page"><img src="2.jpg" alt="الصفحة 2" loading="eager"></div>
            <div class="page"><img src="3.jpg" alt="الصفحة 3" loading="eager"></div>
            <div class="page"><img src="4.jpg" alt="الصفحة 4" loading="eager"></div>
            <div class="page"><img src="5.jpg" alt="الصفحة 5" loading="eager"></div>
            <div class="page"><img src="6.jpg" alt="الصفحة 6" loading="eager"></div>
        </div>
    </div>

    <!-- أزرار التنقل -->
    <button class="nav-btn prev" id="prevBtn" aria-label="الصفحة السابقة">
        <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </button>
    <button class="nav-btn next" id="nextBtn" aria-label="الصفحة التالية">
        <svg viewBox="0 0 24 24"><path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
    </button>

    <!-- مؤشر الصفحات -->
    <div class="page-indicator" id="indicator">1 / 6</div>

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js">
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const bookElem = document.getElementById('book');
            const loading = document.getElementById('loading');
            const indicator = document.getElementById('indicator');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            // متغيرات للتحكم
            let pageFlip = null;
            let currentPage = 0;
            let totalPages = 0;
            let isFlipping = false;

            // تهيئة PageFlip
            function initPageFlip() {
                pageFlip = new St.PageFlip(bookElem, {
                    width: window.innerWidth,
                    height: window.innerHeight,
                    size: "stretch",
                    minWidth: 200,
                    maxWidth: 2500,
                    minHeight: 300,
                    maxHeight: 2500,
                    maxShadowOpacity: 0.85,
                    showCover: false,
                    usePortrait: true,
                    startPage: 0,
                    mobileScrollSupport: false,
                    flippingTime: 700,
                    useMouseEvents: true, // تفعيل أحداث الماوس للتقليب بالضغط
                    clickEventForward: false
                });

                const pages = document.querySelectorAll('.page');
                pageFlip.loadFromHTML(pages);

                totalPages = pageFlip.getPageCount();
                updateIndicator();

                // مستمع لتحديث المؤشر بعد التقليب
                pageFlip.on('flip', function(e) {
                    currentPage = pageFlip.getCurrentPageIndex();
                    updateIndicator();
                    updateButtons();
                });

                pageFlip.on('changeState', function(e) {
                    // تحديث حالة الأزرار عند تغيير الحالة
                    updateButtons();
                });

                // إخفاء شاشة التحميل
                setTimeout(() => {
                    loading.classList.add('hidden');
                }, 400);
            }

            // تحديث المؤشر
            function updateIndicator() {
                const pageNum = Math.min(currentPage + 1, totalPages);
                indicator.textContent = `${pageNum} / ${totalPages}`;
            }

            // تحديث حالة الأزرار
            function updateButtons() {
                if (!pageFlip) return;
                const current = pageFlip.getCurrentPageIndex();
                const total = pageFlip.getPageCount();

                prevBtn.style.opacity = current <= 0 ? '0.3' : '1';
                nextBtn.style.opacity = current >= total - 2 ? '0.3' : '1';

                // تعطيل الأزرار عند الوصول للحدود
                prevBtn.style.pointerEvents = current <= 0 ? 'none' : 'auto';
                nextBtn.style.pointerEvents = current >= total - 2 ? 'none' : 'auto';
            }

            // دالة التقليب التالي
            function flipNext() {
                if (!pageFlip || isFlipping) return;
                const current = pageFlip.getCurrentPageIndex();
                const total = pageFlip.getPageCount();
                if (current >= total - 2) return;

                isFlipping = true;
                pageFlip.flipNext('top-right');
                setTimeout(() => { isFlipping = false; }, 750);
            }

            // دالة التقليب السابق
            function flipPrev() {
                if (!pageFlip || isFlipping) return;
                const current = pageFlip.getCurrentPageIndex();
                if (current <= 0) return;

                isFlipping = true;
                pageFlip.flipPrev('top-left');
                setTimeout(() => { isFlipping = false; }, 750);
            }

            // أحداث الأزرار
            prevBtn.addEventListener('click', flipPrev);
            nextBtn.addEventListener('click', flipNext);

            // دعم لوحة المفاتيح
            document.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                    e.preventDefault();
                    flipNext();
                } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    flipPrev();
                }
            });

            // تحسين اللمس - سحب من الحواف
            let startX = 0;
            let startY = 0;
            let isSwiping = false;

            document.addEventListener('touchstart', function(e) {
                const touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                isSwiping = false;
            }, { passive: true });

            document.addEventListener('touchmove', function(e) {
                if (!startX) return;
                const touch = e.touches[0];
                const diffX = touch.clientX - startX;
                const diffY = touch.clientY - startY;

                if (Math.abs(diffX) > 15 && Math.abs(diffX) > Math.abs(diffY)) {
                    isSwiping = true;
                }
            }, { passive: true });

            document.addEventListener('touchend', function(e) {
                if (!startX || !isSwiping) {
                    startX = 0;
                    return;
                }

                const endX = e.changedTouches[0].clientX;
                const diffX = endX - startX;
                const diffY = e.changedTouches[0].clientY - startY;

                // السحب لليمين → التالي، السحب لليسار → السابق
                if (Math.abs(diffX) > 40 && Math.abs(diffX) > Math.abs(diffY) * 1.2) {
                    if (diffX > 0) {
                        // سحب لليمين (في RTL يعني التالي)
                        flipNext();
                    } else {
                        // سحب لليسار (في RTL يعني السابق)
                        flipPrev();
                    }
                }

                startX = 0;
                isSwiping = false;
            }, { passive: true });

            // إعادة التهيئة عند تغيير حجم الشاشة
            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (pageFlip) {
                        pageFlip.update();
                    }
                }, 250);
            });

            // بدء التهيئة
            initPageFlip();

            // تحديث الأزرار بعد تحميل الصور
            window.addEventListener('load', function() {
                setTimeout(() => {
                    if (pageFlip) {
                        pageFlip.update();
                        updateButtons();
                    }
                }, 300);
            });

            console.log('✅ بروشور تفاعلي احترافي - يعمل بنجاح!');
        });
    </script>
</body>
</html>
