<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>البروشور التفاعلي العربي</title>
    <!-- مكتبة Swiper الرسمية الداعمة للغة العربية والتصفح الـ 3D -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            touch-action: none;
        }

        .info-text {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 12px;
            text-align: center;
        }

        /* حجم العرض مخصص لشاشة الموبايل العمودية */
        .swiper {
            width: 92vw;
            max-width: 420px;
            height: 80vh;
            max-height: 650px;
            border-radius: 8px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8);
        }

        .swiper-slide {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* إلغاء الإطارات البيضاء وجعل الصورة تملأ الصفحة بالكامل */
        .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        .page-num {
            color: #ffffff;
            margin-top: 14px;
            font-weight: bold;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 20px;
            border-radius: 20px;
        }
    </style>
</head>
<body dir="rtl">

    <div class="info-text">👈 اسحب من اليمين إلى اليسار لتقليب الصفحة</div>

    <div class="swiper mySwiper" dir="rtl">
        <div class="swiper-wrapper">
            <div class="swiper-slide"><img src="1.jpg" alt="1"></div>
            <div class="swiper-slide"><img src="2.jpg" alt="2"></div>
            <div class="swiper-slide"><img src="3.jpg" alt="3"></div>
            <div class="swiper-slide"><img src="4.jpg" alt="4"></div>
            <div class="swiper-slide"><img src="5.jpg" alt="5"></div>
            <div class="swiper-slide"><img src="6.jpg" alt="6"></div>
        </div>
    </div>

    <div class="page-num" id="page-num">صفحة 1 / 6</div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const swiper = new Swiper('.mySwiper', {
            effect: 'flip',       /* تأثير التقليب الـ 3D */
            grabCursor: true,
            dir: 'rtl',           /* تفعيل الاتجاه العربي الرسمي */
            flipEffect: {
                slideShadows: true,
                limitRotation: true,
            },
            on: {
                init: function () {
                    document.getElementById('page-num').innerText = `صفحة 1 / ${this.slides.length}`;
                },
                slideChange: function () {
                    document.getElementById('page-num').innerText = `صفحة ${this.activeIndex + 1} / ${this.slides.length}`;
                }
            }
        });
    </script>
</body>
</html>
