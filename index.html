<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>بروشور المؤتمر</title>
    <!-- مكتبة انثناء الورق الحقيقي -->
    <script src="page-flip.browser.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #000;
            position: fixed;
            top: 0;
            left: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        #container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
            background-color: #000;
            overflow: hidden;
        }

        #book {
            width: 100% !important;
            height: 100% !important;
        }

        .page {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: fill; /* تمدد كامل دون ترك أي حواف سوداء */
            display: block;
            pointer-events: none;
        }

        /* شريط تحكم شفاف ومضغوط جداً في أسفل الشاشة */
        .compact-bar {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 9999;
        }

        .bar-btn {
            background: rgba(255, 255, 255, 0.18);
            border: none;
            color: #fff;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .bar-btn:active {
            background: rgba(255, 255, 255, 0.4);
        }

        .page-text {
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            direction: ltr;
        }

        /* إشارة سحب خفيفة في الأعلى تختفي بعد 3 ثوانٍ */
        .hint-top {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 12px;
            pointer-events: none;
            z-index: 9998;
            animation: fadeOutHint 3.5s forwards ease-in-out;
        }

        @keyframes fadeOutHint {
            0% { opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body>

    <div id="container">
        <!-- تلميح علوي خفيف -->
        <div class="hint-top" id="hint">اسحب الصفحة للتقليب 👈</div>

        <!-- صفحات البروشور المعرفة كورق مرن soft -->
        <div id="book">
            <div class="page" data-density="soft"><img src="1.jpg" alt="1"></div>
            <div class="page" data-density="soft"><img src="2.jpg" alt="2"></div>
            <div class="page" data-density="soft"><img src="3.jpg" alt="3"></div>
            <div class="page" data-density="soft"><img src="4.jpg" alt="4"></div>
            <div class="page" data-density="soft"><img src="5.jpg" alt="5"></div>
            <div class="page" data-density="soft"><img src="6.jpg" alt="6"></div>
        </div>

        <!-- أزرار التنقل السفلية -->
        <div class="compact-bar">
            <button class="bar-btn" id="nextBtn">التالي ⬅</button>
            <span class="page-text" id="pageNum">1 / 6</span>
            <button class="bar-btn" id="prevBtn">➡ السابق</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('book');
            const total = 6;
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;

            const pageFlip = new St.PageFlip(container, {
                width: screenW,
                height: screenH,
                size: "stretch",
                minWidth: 100,
                maxWidth: 4000,
                minHeight: 100,
                maxHeight: 4000,
                drawShadow: true,
                maxShadowOpacity: 0.45,
                showCover: false,          // إلغاء وضع الغلاف الخشبي وجعل كل الصفحات ورقية
                usePortrait: true,
                mobileScrollSupport: false,
                flippingTime: 750,        // سرعة الانثناء الطبيعية
                useMouseEvents: true,
                swipeDistance: 15,
                direction: 'rtl'           // اتجاه القراءة والتقليب العربي
            });

            pageFlip.loadFromHTML(document.querySelectorAll('.page'));

            const numIndicator = document.getElementById('pageNum');
            const hint = document.getElementById('hint');

            pageFlip.on('flip', (e) => {
                numIndicator.innerText = `${e.data + 1} / ${total}`;
                if (hint) hint.style.display = 'none';
            });

            document.getElementById('nextBtn').addEventListener('click', () => {
                if (hint) hint.style.display = 'none';
                pageFlip.flipNext('bottom');
            });

            document.getElementById('prevBtn').addEventListener('click', () => {
                if (hint) hint.style.display = 'none';
                pageFlip.flipPrev('bottom');
            });

            window.addEventListener('resize', () => {
                pageFlip.updateFromHtml(document.querySelectorAll('.page'));
            });
        });
    </script>
</body>
</html>
