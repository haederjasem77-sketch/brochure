<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>بروشور المؤتمر</title>
<!-- مكتبة التقليب الورقي التفاعلي -->
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: #000;
  position: fixed;
  font-family: system-ui, -apple-system, sans-serif;
}

/* حاوية العرض بملء الشاشة الأصلي */
.book-wrapper {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  background: #000;
  overflow: hidden;
}

#flipbook {
  width: 100%;
  height: 100%;
}

/* تنسيق الصفحات الأصلي الخالي من أي تداخل */
.page {
  width: 100%;
  height: 100%;
  background-color: #000;
  overflow: hidden;
}

.page img {
  width: 100%;
  height: 100%;
  object-fit: fill;
  display: block;
  pointer-events: none;
}

/* رابط الصفحة الأولى الخارجي (فوق الكتاب مباشرة دون تشويه الصفحات) */
#coverLink {
  position: absolute;
  bottom: 5%;
  left: 5%;
  width: 90%;
  height: 6%;
  z-index: 998;
  display: block;
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: rgba(0, 123, 255, 0.25);
}

/* أزرار التقليب الجانبية الشفافة */
.corner-btn {
  position: fixed;
  bottom: 14px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  border: 1px solid rgba(255, 255, 255, 0.25);
  color: #ffffff;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
}

.corner-btn:active {
  background: rgba(255, 255, 255, 0.4);
}

#btnNext {
  left: 12px;
}

#btnPrev {
  right: 12px;
}

/* عداد الصفحات العلوي الصغير */
.page-badge {
  position: fixed;
  top: 12px;
  left: 12px;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #ffffff;
  font-size: 11px;
  font-weight: bold;
  padding: 3px 8px;
  border-radius: 12px;
  direction: ltr;
  z-index: 1000;
  pointer-events: none;
}

/* تلميح التقليب المؤقت */
.subtle-hint {
  position: absolute;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.6);
  color: #fff;
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 12px;
  pointer-events: none;
  z-index: 999;
  animation: fadeOut 3.5s forwards ease-in-out;
}

@keyframes fadeOut {
  0% { opacity: 0; }
  20% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; }
}
</style>
</head>
<body>

<div class="book-wrapper">
  <div class="subtle-hint" id="hint">اسحب للتقليب 👈</div>

  <!-- رابط تفاعلي مستقل فوق الصفحة الأولى -->
  <a id="coverLink" href="https://edu-women.aliraqia.edu.iq/f-ch-w/" target="_blank" rel="noopener noreferrer" title="فتح الموقع"></a>

  <!-- صفحات نقية بدون أي وسوم داخلية لضمان نعومة وانطواء الورق الأصلي -->
  <div id="flipbook">
    <div class="page" data-density="soft"><img src="1.jpg" alt="الصفحة 1"></div>
    <div class="page" data-density="soft"><img src="2.jpg" alt="الصفحة 2"></div>
    <div class="page" data-density="soft"><img src="3.jpg" alt="الصفحة 3"></div>
    <div class="page" data-density="soft"><img src="4.jpg" alt="الصفحة 4"></div>
    <div class="page" data-density="soft"><img src="5.jpg" alt="الصفحة 5"></div>
    <div class="page" data-density="soft"><img src="6.jpg" alt="الصفحة 6"></div>
  </div>
</div>

<div class="page-badge" id="pageNumber">1 / 6</div>

<button class="corner-btn" id="btnNext" title="التالي">‹</button>
<button class="corner-btn" id="btnPrev" title="السابق">›</button>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const screenW = window.innerWidth;
  const screenH = window.innerHeight;
  const total = 6;
  const bookContainer = document.getElementById('flipbook');
  const coverLink = document.getElementById('coverLink');
  const pageNum = document.getElementById('pageNumber');
  const hint = document.getElementById('hint');

  const flipSound = new Audio('flip.mp3');
  flipSound.volume = 0.6;
  flipSound.preload = 'auto';

  function playSound() {
    try {
      flipSound.currentTime = 0;
      flipSound.play().catch(() => {});
    } catch (err) {}
  }

  const pageFlip = new St.PageFlip(bookContainer, {
    width: screenW,
    height: screenH,
    size: "stretch",
    minWidth: 200,
    maxWidth: 1600,
    minHeight: 300,
    maxHeight: 2500,
    maxShadowOpacity: 0.5,
    showCover: false,
    usePortrait: true,
    mobileScrollSupport: false,
    flippingTime: 700,
    useMouseEvents: true,
    swipeDistance: 25,
    direction: 'rtl'
  });

  pageFlip.loadFromHTML(document.querySelectorAll('.page'));

  pageFlip.on('changeState', (e) => {
    if (e.data === 'flipping') {
      playSound();
    }
  });

  pageFlip.on('flip', (e) => {
    const currentPage = e.data; // 0 هو الصفحة الأولى
    pageNum.innerText = (currentPage + 1) + ' / ' + total;
    if (hint) hint.style.display = 'none';

    // إتاحة الرابط في الصفحة الأولى فقط وإخفاؤه تماماً في باقي الصفحات لمنع أي تداخل
    if (coverLink) {
      coverLink.style.display = (currentPage === 0) ? 'block' : 'none';
    }
  });

  document.getElementById('btnNext').addEventListener('click', () => {
    pageFlip.flipNext();
  });

  document.getElementById('btnPrev').addEventListener('click', () => {
    pageFlip.flipPrev();
  });

  window.addEventListener('resize', () => {
    pageFlip.updateFromHtml(document.querySelectorAll('.page'));
  });
});
</script>
</body>
</html>
