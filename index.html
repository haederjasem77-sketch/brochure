<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>البروشور التفاعلي</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        .container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        #book { width: 100% !important; height: 100% !important; }

        .page { 
            width: 100% !important; 
            height: 100% !important; 
            background-color: #000; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page img { 
            max-width: 100% !important; 
            max-height: 100% !important; 
            object-fit: contain !important; /* يمنع التشوه نهائياً */
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="book">
            <div class="page" data-density="soft"><img src="1.jpg"></div>
            <div class="page" data-density="soft"><img src="2.jpg"></div>
            <div class="page" data-density="soft"><img src="3.jpg"></div>
            <div class="page" data-density="soft"><img src="4.jpg"></div>
            <div class="page" data-density="soft"><img src="5.jpg"></div>
            <div class="page" data-density="soft"><img src="6.jpg"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const pageFlip = new St.PageFlip(document.getElementById('book'), {
                width: 800, 
                height: 1100, 
                size: "stretch", 
                isRTL: true,            // يدعم العربية تلقائياً
                usePortrait: true,     // إجبار الموبايل على وضع الصفحة الواحدة
                showCover: false,
                mobileScrollSupport: true,
                flippingTime: 700,
                // الإعداد الأهم لمنع ظهور صفحتين بجانب بعض:
                drawShadow: true,
                maxShadowOpacity: 0.5
            });

            pageFlip.loadFromHTML(document.querySelectorAll('.page'));
        });
    </script>
</body>
</html>
