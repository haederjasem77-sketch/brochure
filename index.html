<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>البروشور التفاعلي</title>
    <!-- استدعاء المكتبة المحلية المرفوعة في المستودع -->
    <script src="page-flip.browser.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            position: fixed;
            touch-action: pan-y;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: #000000;
            overflow: hidden;
        }

        #book {
            margin: auto;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
        }

        .page {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            pointer-events: none;
            -webkit-user-drag: none;
        }

        /* رسالة التنبيه الإرشادية */
        .hint-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            padding: 12px 22px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.25);
            animation: fadeOutHint 4s forwards ease-in-out;
        }

        .hand-icon {
            font-size: 22px;
            animation: swipeHand 1.3s infinite ease-in-out;
        }

        @keyframes swipeHand {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(-18px); }
        }

        @keyframes fadeOutHint {
            0% { opacity: 0; }
            15% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        /* شريط التنقل السفلي */
        .ui-controls {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(20, 20, 20, 0.82);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 7px 18px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 900;
        }

        .ui-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
        }

        .ui-btn:active {
            background: rgba(255, 255, 255, 0.35);
        }

        .page-num {
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            direction: ltr;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- التنبيه التوضيحي -->
        <div id="hintBadge" class="hint-badge">
            <span class="hand-icon">👈</span>
            <span>اسحب أو انقر لتصفح البروشور</span>
        </div>

        <!-- ألبوم الصفحات -->
        <div id="book">
            <div class="page"><img src="1.jpg" alt="1"></div>
            <div class="page"><img src="2.jpg" alt="2"></div>
            <div class="page"><img src="3.jpg" alt="3"></div>
            <div class="page"><img src="4.jpg" alt="4"></div>
            <div class="page"><img src="5.jpg" alt="5"></div>
            <div class="page"><img src="6.jpg" alt="6"></div>
        </div>

        <!-- أزرار التحكم -->
        <div class="ui-controls">
            <button class="ui-btn" id="btnNext">التالي ⬅</button>
            <span class="page-num" id="pageIndicator">1 / 6</span>
            <button class="ui-btn" id="btnPrev">➡ السابق</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const bookElement = document.getElementById('book');
            const totalPages = 6;
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;

            const pageFlip = new St.PageFlip(bookElement, {
                width: screenW,
                height: screenH,
                size: "stretch",
                minWidth: 280,
                maxWidth: 1200,
                minHeight: 400,
                maxHeight: 2000,
                showCover: false,
                usePortrait: true,
                mobileScrollSupport: false,
                direction: 'rtl' // الاتجاه العربي من اليمين لليسار
            });

            pageFlip.loadFromHTML(document.querySelectorAll('.page'));

            const indicator = document.getElementById('pageIndicator');
            const hint = document.getElementById('hintBadge');

            pageFlip.on('flip', (e) => {
                indicator.innerText = `${e.data + 1} / ${totalPages}`;
            });

            pageFlip.on('changeState', () => {
                if (hint) hint.style.display = 'none';
            });

            document.getElementById('btnNext').addEventListener('click', () => {
                if (hint) hint.style.display = 'none';
                pageFlip.flipNext();
            });

            document.getElementById('btnPrev').addEventListener('click', () => {
                if (hint) hint.style.display = 'none';
                pageFlip.flipPrev();
            });
        });
    </script>
</body>
</html>
