<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>البروشور التفاعلي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            position: fixed;
            top: 0;
            left: 0;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000000;
        }

        #book-box {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: scaleX(-1); /* لضبط اتجاه فتح الصفحات لليمين */
        }

        .page {
            background-color: #000000;
            overflow: hidden;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: fill; /* ملء الصفحة بدقة */
            display: block;
            pointer-events: none;
            transform: scaleX(-1); /* إعادة الصور لاتجاهها الصحيح */
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="book-box">
            <div id="book">
                <div class="page" data-density="soft"><img src="1.jpg" alt="1"></div>
                <div class="page" data-density="soft"><img src="2.jpg" alt="2"></div>
                <div class="page" data-density="soft"><img src="3.jpg" alt="3"></div>
                <div class="page" data-density="soft"><img src="4.jpg" alt="4"></div>
                <div class="page" data-density="soft"><img src="5.jpg" alt="5"></div>
                <div class="page" data-density="soft"><img src="6.jpg" alt="6"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script>
        let pageFlip = null;

        function initFlipBook() {
            const bookElem = document.getElementById('book');
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;

            // إزالة النسخة السابقة عند تدوير الشاشة
            if (pageFlip) {
                try { pageFlip.destroy(); } catch (e) {}
            }

            pageFlip = new St.PageFlip(bookElem, {
                width: screenW,
                height: screenH,
                size: "fixed",          // فرض الحجم الثابت ليمنع انقسام الصفحة
                minWidth: 200,
                maxWidth: 3000,
                minHeight: 300,
                maxHeight: 3000,
                maxShadowOpacity: 0.7,
                showCover: true,         // يضمن عرض صفحة واحدة منفردة بملء الشاشة
                usePortrait: true,
                startPage: 0,
                flippingTime: 650,
                useMouseEvents: false
            });

            const pages = document.querySelectorAll('.page');
            pageFlip.loadFromHTML(pages);
        }

        document.addEventListener('DOMContentLoaded', function() {
            initFlipBook();

            let startX = 0;
            let startY = 0;

            window.addEventListener('touchstart', function(e) {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, { passive: true });

            window.addEventListener('touchend', function(e) {
                let diffX = e.changedTouches[0].clientX - startX;
                let diffY = e.changedTouches[0].clientY - startY;

                if (Math.abs(diffX) > 35 && Math.abs(diffX) > Math.abs(diffY)) {
                    if (diffX > 0) {
                        // سحب للأمام مع انثناء ثلاثي الأبعاد مرن
                        pageFlip.flipNext('top');
                    } else {
                        // سحب للخلف مع انثناء ثلاثي الأبعاد مرن
                        pageFlip.flipPrev('top');
                    }
                }
            }, { passive: true });

            // إعادة بناء القياسات فوراً عند قلب الهاتف لمنع الشاشة السوداء
            window.addEventListener('resize', function() {
                setTimeout(initFlipBook, 150);
            });
            window.addEventListener('orientationchange', function() {
                setTimeout(initFlipBook, 200);
            });
        });
    </script>
</body>
</html>
