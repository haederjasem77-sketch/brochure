<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البروشور التفاعلي</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
        }

        .flip-book {
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .page {
            background-color: #ffffff;
            overflow: hidden;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 100;
        }

        .btn {
            background-color: #ffffff;
            color: #0f172a;
            border: none;
            padding: 10px 22px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s ease;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .page-num {
            color: #ffffff;
            font-weight: bold;
            font-size: 15px;
        }

        #loading-msg {
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="loading-msg">جاري تحميل البروشور...</div>

    <div class="container">
        <div id="book" class="flip-book">
            <div class="page"><img src="1.jpg" alt="غلاف البروشور"></div>
            <div class="page"><img src="2.jpg" alt="صفحة 2"></div>
            <div class="page"><img src="3.jpg" alt="صفحة 3"></div>
            <div class="page"><img src="4.jpg" alt="صفحة 4"></div>
            <div class="page"><img src="5.jpg" alt="صفحة 5"></div>
            <div class="page"><img src="6.jpg" alt="الغلاف الخلفي"></div>
        </div>
    </div>

    <div class="controls" id="controls" style="display: none;">
        <button class="btn" id="prev-btn">السابقة</button>
        <span class="page-num" id="page-info">صفحة 1</span>
        <button class="btn" id="next-btn">التالية</button>
    </div>

    <script>
        // قائمة بالمصادر البديلة لمكتبة التقليب
        const cdnSources = [
            "page-flip.browser.js", // الخيار المحلي أولاً
            "https://fastly.jsdelivr.net/npm/page-flip@2.0.7/build/js/page-flip.browser.js",
            "https://cdn.statically.io/npm/page-flip@2.0.7/build/js/page-flip.browser.js",
            "https://unpkg.com/page-flip@2.0.7/build/js/page-flip.browser.js",
            "https://cdn.jsdelivr.net/npm/page-flip@2.0.7/build/js/page-flip.browser.js"
        ];

        function loadScriptSequentially(index) {
            if (index >= cdnSources.length) {
                document.getElementById('loading-msg').innerText = "تعذر تحميل المكتبة من جميع المصادر. يرجى تطبيق الحل الثاني (رفع الملف محلياً).";
                document.getElementById('loading-msg').style.color = "#ff6b6b";
                return;
            }

            const script = document.createElement('script');
            script.src = cdnSources[index];

            script.onload = function() {
                initFlipBook();
            };

            script.onerror = function() {
                // في حال فشل المصدر، يتم التجربة مع المصدر التالي
                loadScriptSequentially(index + 1);
            };

            document.head.appendChild(script);
        }

        function initFlipBook() {
            if (typeof St === 'undefined' || !St.PageFlip) {
                loadScriptSequentially(1);
                return;
            }

            document.getElementById('loading-msg').style.display = 'none';

            const pageFlip = new St.PageFlip(
                document.getElementById('book'),
                {
                    width: 360,
                    height: 520,
                    size: 'fixed',
                    minWidth: 280,
                    maxWidth: 450,
                    minHeight: 400,
                    maxHeight: 650,
                    maxShadowOpacity: 0.5,
                    showCover: true,
                    mobileScrollSupport: false
                }
            );

            pageFlip.loadFromHTML(document.querySelectorAll('.page'));
            document.getElementById('book').style.display = 'block';
            document.getElementById('controls').style.display = 'flex';

            document.getElementById('next-btn').addEventListener('click', () => pageFlip.flipNext());
            document.getElementById('prev-btn').addEventListener('click', () => pageFlip.flipPrev());

            pageFlip.on('flip', (e) => {
                document.getElementById('page-info').innerText = `صفحة ${e.data + 1}`;
            });
        }

        // بدء التحميل
        window.addEventListener('load', () => {
            loadScriptSequentially(0);
        });
    </script>
</body>
</html>
