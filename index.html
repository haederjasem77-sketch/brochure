<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>البروشور التفاعلي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* الحاوية تغطي كامل مساحة الشاشة بالظبط */
        .container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #book {
            width: 100%;
            height: 100%;
        }

        .my-page {
            background-color: #0f172a;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* object-fit: contain تضمن عرض الصورة كاملة 100% دون اقتطاع أي حافة */
        .my-page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="book">
            <div class="my-page"><img src="6.jpg" alt="6"></div>
            <div class="my-page"><img src="5.jpg" alt="5"></div>
            <div class="my-page"><img src="4.jpg" alt="4"></div>
            <div class="my-page"><img src="3.jpg" alt="3"></div>
            <div class="my-page"><img src="2.jpg" alt="2"></div>
            <div class="my-page"><img src="1.jpg" alt="1"></div>
        </div>
    </div>

    <!-- محرك انثناء الورق الـ 3D باللمس -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const pageFlip = new St.PageFlip(document.getElementById('book'), {
                width: window.innerWidth,
                height: window.innerHeight,
                size: "stretch",
                minWidth: 200,
                maxWidth: 2000,
                minHeight: 300,
                maxHeight: 3000,
                maxShadowOpacity: 0.6,
                showCover: false,
                usePortrait: true,
                startPage: 5,
                mobileScrollSupport: false,
                flippingTime: 600
            });

            const pages = document.querySelectorAll('.my-page');
            pageFlip.loadFromHTML(pages);
        });
    </script>
</body>
</html>
