<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>البروشور التفاعلي العربي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            touch-action: none;
            user-select: none;
        }

        .container {
            width: 92vw;
            max-width: 420px;
            height: 75vh;
            max-height: 620px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #book {
            width: 100%;
            height: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        /* يجعل كل الصفحات أوراقاً مرنة بدون إطارات */
        .my-page {
            background-color: #0f172a;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .my-page img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            pointer-events: none;
        }

        /* شريط التحكم والتنقل */
        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }

        .btn {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            transition: background 0.2s;
        }

        .btn:active {
            background: #1d4ed8;
        }

        .page-num {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="book">
            <div class="my-page"><img src="1.jpg" alt="1"></div>
            <div class="my-page"><img src="2.jpg" alt="2"></div>
            <div class="my-page"><img src="3.jpg" alt="3"></div>
            <div class="my-page"><img src="4.jpg" alt="4"></div>
            <div class="my-page"><img src="5.jpg" alt="5"></div>
            <div class="my-page"><img src="6.jpg" alt="6"></div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" id="next-btn">الصفحة التالية 👈</button>
        <span class="page-num" id="page-counter">صفحة 1 / 6</span>
        <button class="btn" id="prev-btn">👉 السابقة</button>
    </div>

    <!-- محرك انثناء الورق الحقيقي PageFlip -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const pageFlip = new St.PageFlip(document.getElementById('book'), {
                width: 400,
                height: 600,
                size: "stretch",
                minWidth: 280,
                maxWidth: 420,
                minHeight: 400,
                maxHeight: 650,
                maxShadowOpacity: 0.6,
                showCover: false,       /* تجعل كل الصفحات أوراقاً مرنة بدون غلاف سميك */
                usePortrait: true,     /* عرض صفحة واحدة منفردة دائماً */
                mobileScrollSupport: false,
                flippingTime: 700
            });

            const pages = document.querySelectorAll('.my-page');
            pageFlip.loadFromHTML(pages);

            const pageCounter = document.getElementById('page-counter');
            const nextBtn = document.getElementById('next-btn');
            const prevBtn = document.getElementById('prev-btn');

            // تحديث رقم الصفحة عند التقليب
            pageFlip.on('flip', (e) => {
                pageCounter.innerText = `صفحة ${e.data + 1} / ${pages.length}`;
            });

            // التقليب للورقة التالية بانثناء الورقة
            nextBtn.addEventListener('click', () => {
                pageFlip.flipNext('top-right');
            });

            // العودة للورقة السابقة بانثناء الورقة
            prevBtn.addEventListener('click', () => {
                pageFlip.flipPrev('top-left');
            });
        });
    </script>
</body>
</html>
