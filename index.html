<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>البروشور التفاعلي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            position: fixed;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            font-family: sans-serif;
        }

        .viewer {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 2200px;
            background: #000000;
        }

        .brochure {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 500px; /* الحجم المثالي لأبعاد شاشات الموبايل */
            max-height: 96vh;
            transform-style: preserve-3d;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: right center; /* محور الدوران من اليمين للقراءة العربية */
            transform-style: preserve-3d;
            transition: transform 0.65s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
            border-radius: 4px;
            overflow: hidden;
            background-color: #000000;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            pointer-events: none;
        }

        /* طبقة الظل التفاعلي لمحاكاة عمق الورقة */
        .page .shadow-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to left, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.05) 20%, rgba(0,0,0,0) 100%);
            opacity: 0;
            transition: opacity 0.65s ease;
            pointer-events: none;
        }

        /* حالة الصفحة المطوية للخلف */
        .page.flipped {
            transform: rotateY(180deg);
            pointer-events: none;
        }

        .page.flipped .shadow-overlay {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="viewer">
        <div class="brochure" id="brochure">
            <!-- ترتيب الصفحات من الغلاف إلى النهاية -->
            <div class="page" style="z-index: 6;"><img src="1.jpg" alt="1"><div class="shadow-overlay"></div></div>
            <div class="page" style="z-index: 5;"><img src="2.jpg" alt="2"><div class="shadow-overlay"></div></div>
            <div class="page" style="z-index: 4;"><img src="3.jpg" alt="3"><div class="shadow-overlay"></div></div>
            <div class="page" style="z-index: 3;"><img src="4.jpg" alt="4"><div class="shadow-overlay"></div></div>
            <div class="page" style="z-index: 2;"><img src="5.jpg" alt="5"><div class="shadow-overlay"></div></div>
            <div class="page" style="z-index: 1;"><img src="6.jpg" alt="6"><div class="shadow-overlay"></div></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const pages = Array.from(document.querySelectorAll('.page'));
            const totalPages = pages.length;
            let currentIndex = 0;

            function flipNext() {
                if (currentIndex < totalPages - 1) {
                    pages[currentIndex].classList.add('flipped');
                    currentIndex++;
                }
            }

            function flipPrev() {
                if (currentIndex > 0) {
                    currentIndex--;
                    pages[currentIndex].classList.remove('flipped');
                }
            }

            let startX = 0;
            let startY = 0;

            window.addEventListener('touchstart', function(e) {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, { passive: true });

            window.addEventListener('touchend', function(e) {
                let diffX = e.changedTouches[0].clientX - startX;
                let diffY = e.changedTouches[0].clientY - startY;

                // التحقق من حركة السحب الأفقي
                if (Math.abs(diffX) > 35 && Math.abs(diffX) > Math.abs(diffY)) {
                    if (diffX > 0) {
                        // سحب لليمين (تقليب الورقة للأمام في الاتجاه العربي)
                        flipNext();
                    } else {
                        // سحب لليسار (إعادة الورقة للخلف بانثناء كامل)
                        flipPrev();
                    }
                }
            }, { passive: true });
        });
    </script>
</body>
</html>
