<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>بروشور المؤتمر</title>
    <script src="page-flip.browser.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #000;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* إجبار حاوية العرض وجميع طبقات المكتبة على ملء الشاشة 100% */
        .book-wrapper, #flipbook, .stf__parent, .stf__wrapper, .stf__block {
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            margin: 0 !important;
            padding: 0 !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            overflow: hidden !important;
        }

        .page, .stf__item {
            width: 100% !important;
            height: 100% !important;
            background-color: #000 !important;
            overflow: hidden !important;
        }

        .page img {
            width: 100% !important;
            height: 100% !important;
            object-fit: fill !important; /* تمدد كامل على مقاس الشاشة */
            display: block !important;
            pointer-events: none;
        }

        /* شريط علوي خفيف لا يغطي محتوى البروشور */
        .top-bar {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 5px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 99999;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .nav-btn:active {
            background: rgba(255, 255, 255, 0.45);
        }

        .page-status {
            color: #ffffff;
            font-size: 13px;
            font-weight: bold;
            direction: ltr;
        }

        /* تلميح إرشادي متحرك */
        .subtle-hint {
            position: fixed;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            font-size: 12px;
            padding: 5px 14px;
            border-radius: 15px;
            pointer-events: none;
            z-index: 99998;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: fadeOut 4s forwards ease-in-out;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        @keyframes fadeOut {
            0% { opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body>

    <div class="book-wrapper">
        <!-- شريط التحكم العلوي -->
        <div class="top-bar">
            <button class="nav-btn" id="btnNext">التالي ⬅</button>
            <span class="page-status" id="pageNumber">1 / 6</span>
            <button class="nav-btn" id="btnPrev">➡ السابق</button>
        </div>

        <!-- التلميح التوضيحي -->
        <div class="subtle-hint" id="hint">
            <span>اسحب من اليسار لليمين للتقليب</span>
            <span>👉</span>
        </div>

        <!-- الصفحات الورقية -->
        <div id="flipbook">
            <div class="page" data-density="soft"><img src="1.jpg" alt="1"></div>
            <div class="page" data-density="soft"><img src="2.jpg" alt="2"></div>
            <div class="page" data-density="soft"><img src="3.jpg" alt="3"></div>
            <div class="page" data-density="soft"><img src="4.jpg" alt="4"></div>
            <div class="page" data-density="soft"><img src="5.jpg" alt="5"></div>
            <div class="page" data-density="soft"><img src="6.jpg" alt="6"></div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;
            const total = 6;
            const bookContainer = document.getElementById('flipbook');

            const pageFlip = new St.PageFlip(bookContainer, {
                width: screenW,
                height: screenH,
                size: "stretch",
                minWidth: 100,
                maxWidth: 4000,
                minHeight: 100,
                maxHeight: 4000,
                maxShadowOpacity: 0.6,
                showCover: false,
                usePortrait: true,
                mobileScrollSupport: false,
                flippingTime: 800,
                useMouseEvents: true,
                swipeDistance: 20,
                drawShadow: true,
                direction: 'rtl'
            });

            pageFlip.loadFromHTML(document.querySelectorAll('.page'));

            const pageNum = document.getElementById('pageNumber');
            const hint = document.getElementById('hint');

            pageFlip.on('flip', (e) => {
                pageNum.innerText = `${e.data + 1} / ${total}`;
                if (hint) hint.style.display = 'none';
            });

            document.getElementById('btnNext').addEventListener('click', () => {
                if (hint) hint.style.display = 'none';
                pageFlip.flipNext('bottom');
            });

            document.getElementById('btnPrev').addEventListener('click', () => {
                if (hint) hint.style.display = 'none';
                pageFlip.flipPrev('bottom');
            });

            window.addEventListener('resize', () => {
                pageFlip.updateFromHtml(document.querySelectorAll('.page'));
            });
        });
    </script>
</body>
</html>
