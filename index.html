<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>البروشور التفاعلي العربي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background-color: #000; position: fixed;
            touch-action: none; user-select: none;
        }
        .container {
            width: 100vw; height: 100vh; height: 100dvh;
            display: flex; justify-content: center; align-items: center;
        }
        /* إزالة transform: scaleX(-1) من هنا */
        #book { width: 100% !important; height: 100% !important; }
        
        .page {
            width: 100% !important; height: 100% !important;
            background-color: #000; overflow: hidden;
        }

        .page img {
            width: 100% !important; height: 100% !important;
            /* استخدام contain بدل fill لمنع التشوه */
            object-fit: contain !important; 
            display: block; pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="book">
            <div class="page" data-density="soft"><img src="1.jpg" alt="1"></div>
            <div class="page" data-density="soft"><img src="2.jpg" alt="2"></div>
            <div class="page" data-density="soft"><img src="3.jpg" alt="3"></div>
            <div class="page" data-density="soft"><img src="4.jpg" alt="4"></div>
            <div class="page" data-density="soft"><img src="5.jpg" alt="5"></div>
            <div class="page" data-density="soft"><img src="6.jpg" alt="6"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const pageFlip = new St.PageFlip(document.getElementById('book'), {
                width: 600, // حدد عرضاً افتراضياً
                height: 800, // حدد طولاً افتراضياً
                size: "stretch", // ستتمدد داخل الحاوية
                isRTL: true, // هذه الخاصية تغنيك عن الـ CSS المقلوب
                maxShadowOpacity: 0.85,
                showCover: false,
                usePortrait: true,
                mobileScrollSupport: true, // تفعيل دعم اللمس بشكل طبيعي
                flippingTime: 700
            });

            pageFlip.loadFromHTML(document.querySelectorAll('.page'));
        });
    </script>
</body>
</html>
