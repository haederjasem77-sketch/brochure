<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>البروشور التفاعلي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #050505;
            overflow: hidden;
            position: fixed;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            font-family: sans-serif;
        }

        .viewer {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 2000px;
            background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
        }

        .brochure {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            max-height: 96vh;
            transform-style: preserve-3d;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: right center;
            transform-style: preserve-3d;
            transition: transform 0.75s cubic-bezier(0.3, 0.15, 0.2, 1);
            will-change: transform;
            border-radius: 3px;
            overflow: hidden;
            background-color: #111;
            box-shadow: -4px 0 15px rgba(0, 0, 0, 0.5);
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            pointer-events: none;
        }

        /* محاكاة تقوس الورقة عبر موجة الضوء والظل */
        .page .curl-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: linear-gradient(
                to left,
                rgba(0, 0, 0, 0.6) 0%,
                rgba(255, 255, 255, 0.3) 25%,
                rgba(0, 0, 0, 0.45) 50%,
                rgba(0, 0, 0, 0) 100%
            );
            opacity: 0;
            transform: translateX(-100%);
            transition: opacity 0.75s ease, transform 0.75s cubic-bezier(0.3, 0.15, 0.2, 1);
        }

        /* ظل السقوط بين الصفحات */
        .page .spine-shadow {
            position: absolute;
            top: 0;
            right: 0;
            width: 40px;
            height: 100%;
            background: linear-gradient(to left, rgba(0, 0, 0, 0.7) 0%, transparent 100%);
            pointer-events: none;
        }

        /* حالة الورقة بعد التقليب */
        .page.flipped {
            transform: rotateY(180deg);
            pointer-events: none;
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.5);
        }

        .page.flipped .curl-layer {
            opacity: 1;
            transform: translateX(100%);
        }
    </style>
</head>
<body>

    <div class="viewer">
        <div class="brochure" id="brochure">
            <div class="page" style="z-index: 6;">
                <img src="1.jpg" alt="1">
                <div class="spine-shadow"></div>
                <div class="curl-layer"></div>
            </div>
            <div class="page" style="z-index: 5;">
                <img src="2.jpg" alt="2">
                <div class="spine-shadow"></div>
                <div class="curl-layer"></div>
            </div>
            <div class="page" style="z-index: 4;">
                <img src="3.jpg" alt="3">
                <div class="spine-shadow"></div>
                <div class="curl-layer"></div>
            </div>
            <div class="page" style="z-index: 3;">
                <img src="4.jpg" alt="4">
                <div class="spine-shadow"></div>
                <div class="curl-layer"></div>
            </div>
            <div class="page" style="z-index: 2;">
                <img src="5.jpg" alt="5">
                <div class="spine-shadow"></div>
                <div class="curl-layer"></div>
            </div>
            <div class="page" style="z-index: 1;">
                <img src="6.jpg" alt="6">
                <div class="spine-shadow"></div>
                <div class="curl-layer"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const pages = Array.from(document.querySelectorAll('.page'));
            const totalPages = pages.length;
            let currentIndex = 0;

            function flipNext() {
                if (currentIndex < totalPages - 1) {
                    pages[currentIndex].classList.add('flipped');
                    currentIndex++;
                }
            }

            function flipPrev() {
                if (currentIndex > 0) {
                    currentIndex--;
                    pages[currentIndex].classList.remove('flipped');
                }
            }

            let startX = 0;
            let startY = 0;

            window.addEventListener('touchstart', function(e) {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, { passive: true });

            window.addEventListener('touchend', function(e) {
                let diffX = e.changedTouches[0].clientX - startX;
                let diffY = e.changedTouches[0].clientY - startY;

                if (Math.abs(diffX) > 35 && Math.abs(diffX) > Math.abs(diffY)) {
                    if (diffX > 0) {
                        // سحب لليمين: تقليب للأمام بانثناء مرن
                        flipNext();
                    } else {
                        // سحب لليسار: رجوع للخلف بانثناء مرن ومطابق
                        flipPrev();
                    }
                }
            }, { passive: true });
        });
    </script>
</body>
</html>
