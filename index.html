<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>البروشور التفاعلي العربي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: absolute;
            top: 0;
            left: 0;
        }

        #book {
            width: 100% !important;
            height: 100% !important;
        }

        .page {
            width: 100% !important;
            height: 100% !important;
            background-color: #000000;
            overflow: hidden;
        }

        .page img {
            width: 100% !important;
            height: 100% !important;
            object-fit: fill !important;
            display: block;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="book">
            <!-- الترتيب الطبيعي للصفحات -->
            <div class="page"><img src="1.jpg" alt="1"></div>
            <div class="page"><img src="2.jpg" alt="2"></div>
            <div class="page"><img src="3.jpg" alt="3"></div>
            <div class="page"><img src="4.jpg" alt="4"></div>
            <div class="page"><img src="5.jpg" alt="5"></div>
            <div class="page"><img src="6.jpg" alt="6"></div>
        </div>
    </div>

    <!-- محرك انثناء الورق 3D -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const bookElem = document.getElementById('book');

            const pageFlip = new St.PageFlip(bookElem, {
                width: window.innerWidth,
                height: window.innerHeight,
                size: "stretch",
                minWidth: 200,
                maxWidth: 2500,
                minHeight: 300,
                maxHeight: 2500,
                maxShadowOpacity: 0.8,
                showCover: false,
                usePortrait: true,
                startPage: 0,
                mobileScrollSupport: false,
                flippingTime: 700,
                useMouseEvents: true,
                clickEventForward: false
            });

            const pages = document.querySelectorAll('.page');
            pageFlip.loadFromHTML(pages);

            let startX = 0;
            let startY = 0;

            window.addEventListener('touchstart', function(e) {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, { passive: true });

            window.addEventListener('touchend', function(e) {
                let endX = e.changedTouches[0].clientX;
                let endY = e.changedTouches[0].clientY;
                let diffX = endX - startX;
                let diffY = endY - startY;

                if (Math.abs(diffX) > 30 && Math.abs(diffX) > Math.abs(diffY)) {
                    if (diffX > 0) {
                        // سحب من اليسار إلى اليمين -> التقليب للصفحة التالية (عربي) بانثناء ورقي 3D من اليسار
                        pageFlip.flipNext('bottom-left');
                    } else {
                        // سحب من اليمين إلى اليسار -> العودة للصفحة السابقة
                        pageFlip.flipPrev('bottom-right');
                    }
                }
            }, { passive: true });
        });
    </script>
</body>
</html>
