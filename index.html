<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>البروشور التفاعلي العربي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            touch-action: none;
            user-select: none;
            padding: 8px 0;
        }

        /* توسيع الحاوية لتملأ الشاشة بالكامل */
        .container {
            width: 100vw;
            height: 88vh;
            height: 88dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #book {
            width: 100%;
            height: 100%;
        }

        .my-page {
            background-color: #0f172a;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* تجعل الصورة تغطي كامل مساحة الشاشة بدون أي حواف */
        .my-page img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 4px;
        }

        .btn {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .btn:active {
            background: #1d4ed8;
        }

        .page-num {
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="book">
            <div class="my-page"><img src="6.jpg" alt="6"></div>
            <div class="my-page"><img src="5.jpg" alt="5"></div>
            <div class="my-page"><img src="4.jpg" alt="4"></div>
            <div class="my-page"><img src="3.jpg" alt="3"></div>
            <div class="my-page"><img src="2.jpg" alt="2"></div>
            <div class="my-page"><img src="1.jpg" alt="1"></div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" id="next-btn">الصفحة التالية 👈</button>
        <span class="page-num" id="page-counter">صفحة 1 / 6</span>
        <button class="btn" id="prev-btn">👉 السابقة</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const pageFlip = new St.PageFlip(document.getElementById('book'), {
                width: 450,
                height: 750,
                size: "stretch",
                minWidth: 300,
                maxWidth: 600,
                minHeight: 500,
                maxHeight: 1000,
                maxShadowOpacity: 0.6,
                showCover: false,
                usePortrait: true,
                startPage: 5,
                mobileScrollSupport: false,
                flippingTime: 600
            });

            const pages = document.querySelectorAll('.my-page');
            const totalPages = pages.length;
            pageFlip.loadFromHTML(pages);

            const pageCounter = document.getElementById('page-counter');
            const nextBtn = document.getElementById('next-btn');
            const prevBtn = document.getElementById('prev-btn');

            function updateCounter(pageIndex) {
                const currentRealPage = totalPages - pageIndex;
                pageCounter.innerText = `صفحة ${currentRealPage} / ${totalPages}`;
            }

            pageFlip.on('flip', (e) => {
                updateCounter(e.data);
            });

            nextBtn.addEventListener('click', () => {
                pageFlip.flipPrev('top-left');
            });

            prevBtn.addEventListener('click', () => {
                pageFlip.flipNext('top-right');
            });
        });
    </script>
</body>
</html>
