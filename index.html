<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>البروشور التفاعلي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            touch-action: none;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #book {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        /* إلغاء أي حوافي أو إطارات بيضاء نهائياً */
        .my-page {
            background-color: #0f172a;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .my-page img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="book">
            <div class="my-page"><img src="1.jpg" alt="1"></div>
            <div class="my-page"><img src="2.jpg" alt="2"></div>
            <div class="my-page"><img src="3.jpg" alt="3"></div>
            <div class="my-page"><img src="4.jpg" alt="4"></div>
            <div class="my-page"><img src="5.jpg" alt="5"></div>
            <div class="my-page"><img src="6.jpg" alt="6"></div>
        </div>
    </div>

    <!-- محرك تقليب الصفحات المخصص للموبايل واللمس -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const pageFlip = new St.PageFlip(document.getElementById('book'), {
                width: 380,
                height: 580,
                size: "stretch",
                minWidth: 260,
                maxWidth: 450,
                minHeight: 400,
                maxHeight: 700,
                maxShadowOpacity: 0.8,
                showCover: false,
                mobileScrollSupport: false
            });

            pageFlip.loadFromHTML(document.querySelectorAll('.my-page'));
        });
    </script>
</body>
</html>
