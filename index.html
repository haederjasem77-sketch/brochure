<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>البروشور التفاعلي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            position: fixed;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
            background-color: #000000;
            overflow: hidden;
        }

        /* طبقة عزل اللمس لمنع العشوائية والارتداد */
        #touch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            touch-action: none;
        }

        #flipbook {
            width: 100%;
            height: 100%;
        }

        #flipbook .page {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
        }

        #flipbook .page img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            pointer-events: none;
            -webkit-user-drag: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- طبقة استقبال السحب الحصري -->
        <div id="touch-overlay"></div>

        <div id="flipbook">
            <div class="page"><img src="1.jpg" alt="1"></div>
            <div class="page"><img src="2.jpg" alt="2"></div>
            <div class="page"><img src="3.jpg" alt="3"></div>
            <div class="page"><img src="4.jpg" alt="4"></div>
            <div class="page"><img src="5.jpg" alt="5"></div>
            <div class="page"><img src="6.jpg" alt="6"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
    <script>
        $(document).ready(function() {
            const $book = $('#flipbook');
            const screenW = $(window).width();
            const screenH = $(window).height();

            // تهيئة محرك ثني الورق بملء شاشة الموبايل
            $book.turn({
                width: screenW,
                height: screenH,
                autoCenter: true,
                display: 'single',
                elevation: 60,
                gradients: true,
                acceleration: true,
                duration: 600
            });

            let touchStartX = 0;
            let touchStartY = 0;
            let touchStartTime = 0;

            const overlay = document.getElementById('touch-overlay');

            overlay.addEventListener('touchstart', function(e) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                touchStartTime = Date.now();
            }, { passive: true });

            overlay.addEventListener('touchend', function(e) {
                // منع التداخل أثناء تقليب الورقة
                if ($book.turn('animating')) return;

                let touchEndX = e.changedTouches[0].clientX;
                let touchEndY = e.changedTouches[0].clientY;
                let diffX = touchEndX - touchStartX;
                let diffY = touchEndY - touchStartY;
                let elapsedTime = Date.now() - touchStartTime;

                // التأكد من أن الحركة أفقية ومقصودة
                if (Math.abs(diffX) > 35 && Math.abs(diffX) > Math.abs(diffY) && elapsedTime < 700) {
                    if (diffX > 0) {
                        // سحب من اليسار إلى اليمين: يقلب للأمام بانثناء ورقي كامل
                        $book.turn('next');
                    } else {
                        // سحب من اليمين إلى اليسار: يرجع للخلف بانثناء ورقي مطابق
                        $book.turn('previous');
                    }
                }
            }, { passive: true });

            $(window).on('resize orientationchange', function() {
                setTimeout(function() {
                    $book.turn('size', $(window).width(), $(window).height());
                }, 150);
            });
        });
    </script>
</body>
</html>
