<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>البروشور التفاعلي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            position: fixed;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #050505;
        }

        #flipbook {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
        }

        #flipbook .page {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
        }

        #flipbook .page img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="flipbook">
            <div class="page"><img src="1.jpg" alt="1"></div>
            <div class="page"><img src="2.jpg" alt="2"></div>
            <div class="page"><img src="3.jpg" alt="3"></div>
            <div class="page"><img src="4.jpg" alt="4"></div>
            <div class="page"><img src="5.jpg" alt="5"></div>
            <div class="page"><img src="6.jpg" alt="6"></div>
        </div>
    </div>

    <!-- مكتبات محاكاة انثناء الورق الحقيقي -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
    <script>
        $(document).ready(function() {
            const screenW = $(window).width();
            const screenH = $(window).height();

            $('#flipbook').turn({
                width: screenW,
                height: screenH,
                autoCenter: true,
                display: 'single',       // صفحة مفردة تملأ شاشة الموبايل بالكامل
                direction: 'rtl',        // تقليب عربي أصيل دون عكس الشاشة
                elevation: 60,           // عمق تقوس وانثناء زاوية الورقة أثناء الحركة
                gradients: true,         // تدرجات لمعان وظلال ثني الورق
                acceleration: true,      // معالجة بالـ GPU لضمان أقصى سلاسة
                duration: 750            // وقت الانثناء الطبيعي
            });

            // إيماءات اللمس والسحب بالاتجاهين
            let touchStartX = 0;
            let touchStartY = 0;

            window.addEventListener('touchstart', function(e) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }, { passive: true });

            window.addEventListener('touchend', function(e) {
                let diffX = e.changedTouches[0].clientX - touchStartX;
                let diffY = e.changedTouches[0].clientY - touchStartY;

                if (Math.abs(diffX) > 30 && Math.abs(diffX) > Math.abs(diffY)) {
                    if (diffX > 0) {
                        // سحب لليمين: تقليب للأمام بانثناء وتقوس حقيقي
                        $('#flipbook').turn('next');
                    } else {
                        // سحب لليسار: رجوع للخلف بانثناء وتقوس حقيقي مطابق
                        $('#flipbook').turn('previous');
                    }
                }
            }, { passive: true });

            // تحديث القياسات تلقائياً عند تغيير حجم الشاشة
            $(window).on('resize orientationchange', function() {
                setTimeout(function() {
                    $('#flipbook').turn('size', $(window).width(), $(window).height());
                }, 150);
            });
        });
    </script>
</body>
</html>
