<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>بروشور المؤتمر</title>
    
    <!-- استدعاء المكتبة مع حماية تلقائية لضمان عملها -->
    <script src="page-flip.browser.js"></script>
    <script>
        if (typeof St === 'undefined') {
            document.write('<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"><\/script>');
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #000;
            position: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .viewport {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: #000;
        }

        #flipbook {
            width: 100%;
            height: 100%;
        }

        .page {
            background-color: #000;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        /* شريط تحكم سفلي صغير وشفاف */
        .bottom-nav {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 99999;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.22);
            border: none;
            color: #fff;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .nav-btn:active {
            background: rgba(255, 255, 255, 0.45);
        }

        .page-counter {
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            direction: ltr;
        }

        /* تلميح إرشادي في الأعلى يختفي بعد 3 ثوانٍ */
        .top-hint {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            font-size: 12px;
            padding: 4px 14px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 99999;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: fadeOut 3.5s forwards ease-in-out;
        }

        @keyframes fadeOut {
            0% { opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body>

    <div class="top-hint" id="hintBox">
        <span>اسحب الصفحة لتصفح البروشور</span>
        <span>👈</span>
    </div>

    <div class="viewport">
        <div id="flipbook">
            <div class="page" data-density="soft"><img src="1.jpg" alt="1"></div>
            <div class="page" data-density="soft"><img src="2.jpg" alt="2"></div>
            <div class="page" data-density="soft"><img src="3.jpg" alt="3"></div>
            <div class="page" data-density="soft"><img src="4.jpg" alt="4"></div>
            <div class="page" data-density="soft"><img src="5.jpg" alt="5"></div>
            <div class="page" data-density="soft"><img src="6.jpg" alt="6"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-btn" id="nextPage">التالي ⬅</button>
        <span class="page-counter" id="pageNumber">1 / 6</span>
        <button class="nav-btn" id="prevPage">➡ السابق</button>
    </div>

    <script>
        window.addEventListener('load', () => {
            const bookEl = document.getElementById('flipbook');
            const total = 6;
            const w = window.innerWidth;
            const h = window.innerHeight;

            const pageFlip = new St.PageFlip(bookEl, {
                width: w,
                height: h,
                size: "stretch",
                minWidth: 150,
                maxWidth: 3500,
                minHeight: 250,
                maxHeight: 3500,
                showCover: false,
                usePortrait: true,
                drawShadow: true,
                maxShadowOpacity: 0.5,
                flippingTime: 750,
                useMouseEvents: true,
                swipeDistance: 15,
                direction: 'rtl'
            });

            pageFlip.loadFromHTML(document.querySelectorAll('.page'));

            const counter = document.getElementById('pageNumber');
            const hint = document.getElementById('hintBox');

            pageFlip.on('flip', (e) => {
                counter.innerText = `${e.data + 1} / ${total}`;
                if (hint) hint.style.display = 'none';
            });

            document.getElementById('nextPage').addEventListener('click', () => {
                if (hint) hint.style.display = 'none';
                pageFlip.flipNext('bottom');
            });

            document.getElementById('prevPage').addEventListener('click', () => {
                if (hint) hint.style.display = 'none';
                pageFlip.flipPrev('bottom');
            });
        });
    </script>
</body>
</html>
