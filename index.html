<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>البروشور التفاعلي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        #book {
            width: 100% !important;
            height: 100% !important;
        }

        .my-page {
            width: 100% !important;
            height: 100% !important;
            background-color: #000000;
            overflow: hidden;
        }

        .my-page img {
            width: 100% !important;
            height: 100% !important;
            object-fit: fill !important;
            display: block;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="book">
            <div class="my-page"><img src="6.jpg" alt="6"></div>
            <div class="my-page"><img src="5.jpg" alt="5"></div>
            <div class="my-page"><img src="4.jpg" alt="4"></div>
            <div class="my-page"><img src="3.jpg" alt="3"></div>
            <div class="my-page"><img src="2.jpg" alt="2"></div>
            <div class="my-page"><img src="1.jpg" alt="1"></div>
        </div>
    </div>

    <!-- محرك انثناء الورق 3D المرن -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const bookElem = document.getElementById('book');

            const pageFlip = new St.PageFlip(bookElem, {
                width: window.innerWidth,
                height: window.innerHeight,
                size: "stretch",
                minWidth: 200,
                maxWidth: 2500,
                minHeight: 300,
                maxHeight: 2500,
                maxShadowOpacity: 0.85, /* ظلال مكثفة لإبراز قوس وتعرج الورقة أثناء الطي */
                showCover: false,      /* إلغاء أي غلاف صلب */
                usePortrait: true,
                startPage: 5,         /* البدء بالصفحة رقم 1 */
                mobileScrollSupport: false,
                flippingTime: 800,     /* زمن انثناء مرن لإظهار حركة انحناء الورقة */
                useMouseEvents: true,
                showPageCorners: true, /* إظهار زاوية الورقة وهي تنثني وتلتف مع اللمس */
                clickEventForward: false,
                swipeDistance: 15
            });

            const pages = document.querySelectorAll('.my-page');
            pageFlip.loadFromHTML(pages);
        });
    </script>
</body>
</html>
