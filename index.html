<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>البروشور التفاعلي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            position: fixed;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
            background-color: #000000;
            overflow: hidden;
        }

        /* طبقة التقليب باللمس */
        #touch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            touch-action: none;
        }

        #flipbook {
            width: 100%;
            height: 100%;
        }

        #flipbook .page {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
        }

        #flipbook .page img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            pointer-events: none;
            -webkit-user-drag: none;
        }

        /* تلميح اليد المتحركة */
        .hint-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.82);
            color: #ffffff;
            padding: 12px 22px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: none;
            z-index: 200;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.25);
            animation: fadeOutHint 4.5s forwards ease-in-out;
        }

        .hand-icon {
            font-size: 22px;
            animation: swipeHand 1.3s infinite ease-in-out;
        }

        @keyframes swipeHand {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(18px); }
        }

        @keyframes fadeOutHint {
            0% { opacity: 0; }
            15% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        /* شريط تحكم سفلي أنيق وشفاف */
        .ui-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(20, 20, 20, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 6px 16px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 200;
        }

        .ui-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
        }

        .ui-btn:active {
            background: rgba(255, 255, 255, 0.3);
        }

        .page-num {
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            direction: ltr;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- طبقة التنبيه الإرشادي -->
        <div id="hintBadge" class="hint-badge">
            <span class="hand-icon">👉</span>
            <span>اسحب الشاشة لتصفح باقي الصفحات</span>
        </div>

        <!-- أزرار التنقل والترقيم -->
        <div class="ui-controls">
            <button class="ui-btn" id="btnNext">التالي ⬅</button>
            <span class="page-num" id="pageIndicator">1 / 6</span>
            <button class="ui-btn" id="btnPrev">➡ السابق</button>
        </div>

        <div id="touch-overlay"></div>

        <div id="flipbook">
            <div class="page"><img src="1.jpg" alt="1"></div>
            <div class="page"><img src="2.jpg" alt="2"></div>
            <div class="page"><img src="3.jpg" alt="3"></div>
            <div class="page"><img src="4.jpg" alt="4"></div>
            <div class="page"><img src="5.jpg" alt="5"></div>
            <div class="page"><img src="6.jpg" alt="6"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- تم التحديث إلى الإصدار 4 لدعم RTL الأصلي -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/4.1.0/turn.min.js"></script>
    <script>
        $(document).ready(function() {
            const $book = $('#flipbook');
            const screenW = $(window).width();
            const screenH = $(window).height();
            const totalPages = 6;

            $book.turn({
                width: screenW,
                height: screenH,
                autoCenter: true,
                display: 'single',
                elevation: 60,
                gradients: true,
                acceleration: true,
                duration: 600,
                direction: 'rtl' // ضبط اتجاه حركة الورق للكتاب العربي
            });

            // تحديث رقم الصفحة عند التقليب
            $book.bind('turned', function(event, page) {
                $('#pageIndicator').text(page + ' / ' + totalPages);
            });

            let touchStartX = 0;
            let touchStartY = 0;
            let touchStartTime = 0;

            const overlay = document.getElementById('touch-overlay');
            const hint = document.getElementById('hintBadge');

            overlay.addEventListener('touchstart', function(e) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                touchStartTime = Date.now();
                if (hint) hint.style.display = 'none';
            }, { passive: true });

            overlay.addEventListener('touchend', function(e) {
                if ($book.turn('animating')) return;

                let touchEndX = e.changedTouches[0].clientX;
                let touchEndY = e.changedTouches[0].clientY;
                let diffX = touchEndX - touchStartX;
                let diffY = touchEndY - touchStartY;
                let elapsedTime = Date.now() - touchStartTime;

                if (Math.abs(diffX) > 35 && Math.abs(diffX) > Math.abs(diffY) && elapsedTime < 700) {
                    if (diffX > 0) {
                        // سحب من اليسار إلى اليمين -> تقليب الصفحة التالية (عربي)
                        $book.turn('next');
                    } else {
                        // سحب من اليمين إلى اليسار -> الرجوع للصفحة السابقة
                        $book.turn('previous');
                    }
                }
            }, { passive: true });

            // التحكم عبر الأزرار السفلية
            $('#btnNext').on('click', function() {
                if (hint) hint.style.display = 'none';
                $book.turn('next');
            });

            $('#btnPrev').on('click', function() {
                if (hint) hint.style.display = 'none';
                $book.turn('previous');
            });

            $(window).on('resize orientationchange', function() {
                setTimeout(function() {
                    $book.turn('size', $(window).width(), $(window).height());
                }, 150);
            });
        });
    </script>
</body>
</html>
